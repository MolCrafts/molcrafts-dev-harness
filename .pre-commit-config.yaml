# Managed by prek: `prek install`
default_install_hook_types: [pre-commit, pre-push]

# Local hooks mirror .github/workflows/lint.yml and test.yml exactly.
# Single source of truth for "what CI runs" — keep commands in lockstep.
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run all:  pre-commit run --all-files


repos:
  - repo: local
    hooks:
      - id: validate-repository
        name: validate plugin metadata (CI parity)
        entry: python3 scripts/validate_repository.py --root .
        language: system
        pass_filenames: false
        always_run: true

      - id: test-structural
        name: structural unit tests (CI parity)
        entry: python3 -m unittest discover -s tests -p 'test_*.py'
        language: system
        pass_filenames: false
        always_run: true
